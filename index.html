<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🥦 Broccoli</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      color: #111;
      background: #fff;
    }

    main {
      width: min(90%, 520px);
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2.5rem;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0 0 28px;
      color: #666;
    }

    form {
      display: flex;
      gap: 8px;
    }

    input,
    button {
      height: 44px;
      padding: 0 14px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font: inherit;
    }

    input {
      flex: 1;
      min-width: 0;
    }

    button {
      color: #fff;
      background: #111;
      border-color: #111;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

		.logo {
			animation: grump 4s ease-in-out infinite;
		}

		@keyframes grump {
			0%, 84% {
				transform: translate(0, 0) rotate(0);
			}

			/* first little grumble */
			86% {
				transform: translate(-1px, 0) rotate(-0.3deg);
			}
			87% {
				transform: translate(1px, 0) rotate(0.3deg);
			}

			/* building */
			88% {
				transform: translate(-2px, 1px) rotate(-0.7deg);
			}
			89% {
				transform: translate(2px, -1px) rotate(0.7deg);
			}

			/* peak grump */
			90% {
				transform: translate(-3px, 1px) rotate(-1deg);
			}
			91% {
				transform: translate(3px, -1px) rotate(1deg);
			}
			92% {
				transform: translate(-2px, 0) rotate(-0.6deg);
			}

			/* gentle settle */
			94% {
				transform: translate(1px, 0) rotate(0.3deg);
			}
			96%, 100% {
				transform: translate(0, 0) rotate(0);
			}
		}
  </style>
</head>

<body style="min-height: 100vh">
  <main>
		<h1 style="color: #005100">Where hoosiers go<br />to design chips</h1>
		<p style="padding-top: 1rem">Follow along for updates.<br />New site coming soon.</p>
		<img class="logo" alt="logo" style="padding-bottom: 3rem" height="128" src="./img/logo.svg" />

    <form id="signup">
      <input
        type="email"
        name="email"
        placeholder="Enter your email"
        aria-label="Email address"
        required
				style="background-color: #e0ffd2; border-color: #005100; color: #005100"
      >
			<input
					type="text"
					name="website"
					tabindex="-1"
					autocomplete="off"
					style="position:absolute;left:-9999px"
					>
			<button type="submit" style="background-color: #005100; color: white; font-weight: bold">Claim Invite</button>
    </form>

		<script>
			const form = document.querySelector("#signup");

			form.addEventListener("submit", async (event) => {
				event.preventDefault();

				const email = form.email.value;

				const response = await fetch(
					"https://signup-worker.stevenkneiser.workers.dev",
					{
						method: "POST",
						headers: {
							"Content-Type": "application/json"
						},
						body: JSON.stringify({ email, website })
					}
				);

				if (response.ok) {
					form.innerHTML = "<p>Welcome to the club.</p>";
				} else {
					alert("Oops! Cloudflare is offline. Email steven.kneiser@broccoli.computer");
				}
			});
		</script>

		<!-- <img alt="mem" src="./img/bcli-mem.png" /> -->
  </main>
</body>
</html>
